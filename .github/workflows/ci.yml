# CI for the VR Lifeguard CMS. Explanation per job and how to read a failed run: docs/ci.md.
# CodeQL runs separately through GitHub's default setup and is not part of this file.
name: CI

on:
  push:
    branches: ['**']

# A new push to the same branch cancels the run that is still going. Not on main: a run there can
# be publishing a release, which must not stop halfway; the next run on main waits instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Same Node version as the Docker images (node:22-alpine in backend/ and frontend/Dockerfile).
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend – npm ci
        working-directory: backend
        run: npm ci
      - name: Backend – lint
        working-directory: backend
        run: npm run lint
      - name: Frontend – npm ci
        working-directory: frontend
        run: npm ci
      - name: Frontend – lint
        working-directory: frontend
        run: npm run lint

  build:
    name: Build (Docker images)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker-compose.yml reads .env (env_file of the api services). Only dummy values: nothing
      # connects to a database in this job. The file is created on the runner and never committed.
      - name: Create .env with dummy values
        run: cp .env.example .env
      # The production images as they run on the VPS: api (target prod) and web (frontend build
      # inside the image + nginx). nginx/certs is only mounted at runtime, not needed to build.
      - name: Build api and web images
        run: docker compose build api web

  tests:
    name: Tests (backend in Docker, frontend Vitest)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Values for the test database only (profile "test", a throwaway MariaDB in tmpfs). These are
      # not secrets: the database exists only during this job. DB_HOST, DB_PORT, LOGOS_DIR and
      # VIDEOS_DIR are set by docker-compose.yml for api-test.
      - name: Create .env for the tests
        run: |
          cat > .env <<'EOF'
          DB_HOST=db-test
          DB_PORT=3306
          DB_NAME=cms
          DB_USER=cms
          DB_PASSWORD=ci-test-only-password
          DB_ROOT_PASSWORD=ci-test-only-root-password
          TEST_DB_NAME=cms_test
          API_PORT=3000
          LOGOS_DIR=/tmp/logos
          VIDEOS_DIR=/tmp/videos
          COOKIE_SECURE=false
          SESSION_IDLE_TIMEOUT_MINUTES=60
          EOF
      - name: Backend tests (MariaDB test database in Docker)
        run: docker compose --profile test run --rm --build api-test
      # Also when the backend tests failed, so one run shows every failing test.
      - name: Frontend tests (Vitest)
        if: ${{ !cancelled() }}
        run: docker compose run --rm web-build npm test
      - name: Show container status and logs
        if: failure()
        run: |
          docker compose --profile test ps -a
          docker compose --profile test logs --no-color --timestamps
      - name: Stop and remove test containers
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  # Playwright (end-to-end tests in a browser) comes later: its job goes here, after tests.
  e2e:
    name: End-to-end tests (Playwright)
    needs: tests
    runs-on: ubuntu-latest
    env:  
      # Alleen voor de wegwerp-omgeving in deze job; geen geheimen. Het wachtwoord van de admin is
      # minimaal 10 tekens (create-admin.js).
      E2E_ADMIN_LOGIN: testadmin
      E2E_ADMIN_PASSWORD: ci-e2e-admin-password
      E2E_PASSWORD: ci-e2e-org-password
      # In CI is de app zelf de wegwerpomgeving (poort 443); lokaal draaien de tests op een aparte
      # omgeving op poort 9443 (e2e/scripts/run-local.mjs, e2e/helpers/base-url.js).
      E2E_BASE_URL: https://localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
    # De app draait hier echt (db, api, web met nginx), met een wegwerpdatabase.
      - name: Create .env for the running app
        run: |
          cat > .env <<'EOF'
          DB_HOST=db
          DB_PORT=3306
          DB_NAME=cms
          DB_USER=cms
          DB_PASSWORD=ci-e2e-only-password
          DB_ROOT_PASSWORD=ci-e2e-only-root-password
          TEST_DB_NAME=cms_test
          API_PORT=3000
          LOGOS_DIR=/tmp/logos
          VIDEOS_DIR=/tmp/videos
          SESSION_IDLE_TIMEOUT_MINUTES=60
          VIDEO_MIN_FREE_SPACE_GB=1
          EOF
      - name: Create self-signed certificate
        run: sh nginx/dev-cert.sh
      - name: Start the app
        run: docker compose up -d --build api web
      - name: Wait until the API answers
        run: curl -ksf --retry 30 --retry-delay 2 --retry-all-errors https://localhost/api/health
      - name: Migrate the database
        run: docker compose exec -T api npx knex migrate:latest
      - name: Create the test administrator
        run: printf '%s\n%s\n' "$E2E_ADMIN_PASSWORD" "$E2E_ADMIN_PASSWORD" | docker compose exec -T api node scripts/create-admin.js "$E2E_ADMIN_LOGIN"

      - name: Playwright – npm ci
        working-directory: e2e
        run: npm ci
      # De browser downloaden duurt meestal 15–35 s, maar soms minuten (210 s op 2026-11-23). Daarom
      # wordt hij bewaard tussen runs, per Playwright-versie. Alleen de headless shell: de tests
      # draaien headless. De systeembibliotheken (apt) staan niet in de cache en worden elke run
      # geïnstalleerd.
      - name: Playwright – read the version
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright – cache Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Playwright – install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps --only-shell chromium
      - name: Playwright – system libraries for Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Run the e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop and remove containers
        if: always()
        run: docker compose down --volumes --remove-orphans



  audit:
    name: Audit (npm audit, high and critical)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm audit reads package-lock.json; no install needed. Fails on high or critical.
      # Only production packages (--omit=dev): that is what ends up in the images. Dev tools such as
      # vitest, vite and eslint are left out, so an advisory without a fix there (e.g. picomatch,
      # GHSA-fc5q-39xc-vjpf) does not block the release. Check those locally with npm audit.
      - name: Backend – npm audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend – npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # Only on main, after every other job passed: a new version vA.B.C and both images on GHCR.
  # Version: the last tag plus one. Patch (C) by default; "#minor" or "#major" in the title of a
  # pull request merged since the last tag raises B or A. Explained in docs/ci.md.
  release:
    name: Release (version tag and images on GHCR)
    needs: audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version tag
      packages: write   # push the images to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all commits and tags, to find the last version
      - name: Determine the next version
        id: version
        run: |
          if last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null); then
            range="$last..HEAD"
          else
            last=v0.0.0; range=HEAD   # no version yet: look at all commits
          fi
          if [ "$(git rev-list --count "$range")" = 0 ]; then
            echo "Nothing new since $last; no release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          # Only pull request titles count. --first-parent walks main itself, so commits made on
          # Development are skipped. A merge commit holds the PR title on the first line of its
          # body; a squash merge or a direct push to main uses its first line.
          log=$(for sha in $(git rev-list --first-parent "$range"); do
                  if git rev-parse -q --verify "$sha^2" >/dev/null; then
                    git log -1 --format=%b "$sha" | sed -n '/./{p;q}'
                  else
                    git log -1 --format=%s "$sha"
                  fi
                done)
          if grep -q '#major' <<< "$log"; then major=$((major + 1)); minor=0; patch=0
          elif grep -q '#minor' <<< "$log"; then minor=$((minor + 1)); patch=0
          else patch=$((patch + 1)); fi
          version="$major.$minor.$patch"
          echo "Last version $last, next version v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.version.outputs.skip == 'false'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Same images as built by hand for v1.0.0 (docs/deployment-vps.md): the web image with the
      # nginx config for the VPS. The label links the packages to this repository.
      - name: Build and push both images
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          registry="ghcr.io/${OWNER,,}"
          labels="--label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.version=$VERSION --label org.opencontainers.image.revision=${{ github.sha }}"
          docker build $labels --target prod -t "$registry/lifeguard-cms-api:$VERSION" -t "$registry/lifeguard-cms-api:latest" backend
          docker build $labels -f frontend/Dockerfile --build-arg NGINX_CONF=default.prod.conf -t "$registry/lifeguard-cms-web:$VERSION" -t "$registry/lifeguard-cms-web:latest" .
          for image in lifeguard-cms-api lifeguard-cms-web; do
            docker push "$registry/$image:$VERSION"
            docker push "$registry/$image:latest"
          done
      # Only after the images are on GHCR, so a version tag always has its images.
      - name: Push the version tag
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          echo "### Released v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "On the VPS: set CMS_VERSION=$VERSION in .env, then pull and up -d (docs/deployment-vps.md)." >> "$GITHUB_STEP_SUMMARY"
