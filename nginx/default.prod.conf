# nginx for the VPS (yonder.lifeguardvr.nl). The webserver of the VPS sits in front of this one:
# it handles HTTPS with the certificate and passes every request on as plain HTTP. So this file
# has no certificate and no redirect to HTTPS (that would loop). Everything else is the same as
# default.conf, which stays in use locally. Keep the location blocks of both files equal.
#
# The webserver of the VPS must allow at least the same limits as below: 32 KB headers, 40 MB
# request bodies on the upload path and 300 s timeouts. Otherwise video uploads fail there.

# The original scheme as the VPS webserver saw it (https); plain $scheme when the header is missing.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # A tus Upload-Metadata header with a 1000-character description and the chosen
    # organisations can reach about 13 KB; the default buffers allow 8 KB (specs/003 research R4).
    large_client_header_buffers 4 32k;

    # Logos are at most 2 MB; leave some room for the multipart envelope.
    client_max_body_size 3m;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Resumable video uploads (tus, specs/002 research R7). Each request carries at most one
    # 32 MB chunk, so no 10 GB bodies or hour-long timeouts are needed. No trailing slash, so
    # the POST to /api/organisation/video-uploads matches too; ^~ wins over other locations.
    location ^~ /api/organisation/video-uploads {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 40m;
        # Stream chunks straight to the API instead of buffering them on the nginx disk.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_body_timeout 120s;
        # The last chunk waits for verification and the thumbnail (at most 60 s, FR-015).
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Video files and thumbnails: only reachable through X-Accel-Redirect from the API after
    # an access check (constitution III, specs/002 research R8). A direct request gets 404.
    location /internal/videos/ {
        internal;
        alias /data/videos/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded files are served straight from the volume (constitution III, research R7).
    location /media/ {
        alias /data/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
